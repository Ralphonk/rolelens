services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rolelens
      POSTGRES_PASSWORD: rolelens
      POSTGRES_DB: rolelens
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rolelens_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolelens"]
      interval: 5s
      retries: 10
volumes:
  rolelens_db:
